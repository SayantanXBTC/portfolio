    <script type="text/javascript">
      // GitHub Pages SPA redirect (rafgraph/spa-github-pages), then map the
      // legacy multi-page URLs (/portfolio/about ...) onto the single-page hashes.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
        var last = l.pathname.replace(/\/+$/, "").split("/").pop();
        var map = {
          about: "about",
          skills: "skills",
          projects: "projects",
          internships: "experience",
          certificates: "education",
          achievements: "achievements",
          education: "education",
          contact: "contact",
        };
        if (map[last] && l.pathname.indexOf("/portfolio/") === 0) {
          window.history.replaceState(null, null, "/portfolio/#" + map[last]);
        }
      })(window.location);
    </script>
